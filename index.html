<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Online</title>

    <!-- Fuente Inter de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: '#0F172A', accent: '#10B981' }
                }
            }
        }
    </script>

    <!-- PapaParse para CSV -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <style>
        /* Asegura visualización de imágenes */
        #contenedor-productos img {
            object-fit: contain !important;
            max-height: 100% !important;
            width: 100% !important;
        }

        #modal-imagen {
            object-fit: contain !important;
            max-height: 420px !important;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-modal { animation: modalIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        .hover-img {
            transition: opacity 0.3s ease-in-out;
        }
        .hover-img:hover {
            opacity: 0;
        }

        /* Estilos responsive para precios */
        .precio-usd-grilla {
            font-size: 0.875rem;
            font-weight: 700;
            color: #2563eb;
        }

        @media (min-width: 1024px) {
            .precio-usd-grilla {
                font-size: 1.125rem;
            }
        }

        .precio-usd-modal {
            font-size: 1rem;
            font-weight: 700;
            color: #2563eb;
        }

        @media (min-width: 768px) {
            .precio-usd-modal {
                font-size: 1.25rem;
            }
        }

        .precio-usd-carrito {
            font-size: 0.875rem;
            font-weight: 700;
            color: #2563eb;
        }

        @media (min-width: 1024px) {
            .precio-usd-carrito {
                font-size: 1rem;
            }
        }

        .total-usd-desktop {
            font-size: 1.125rem;
            font-weight: 700;
            color: #2563eb;
        }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 font-sans antialiased min-h-screen flex flex-col selection:bg-slate-900 selection:text-white pb-20 sm:pb-0">

    <!-- Header Glassmorphism -->
    <header class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-40 transition-all">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-slate-900 text-white flex items-center justify-center rounded-xl font-black text-lg shadow-sm">
                    C
                </div>
                <div>
                    <!-- El JS modificará este título -->
                    <h1 id="titulo-principal" class="text-base sm:text-lg font-black tracking-tight text-slate-900 leading-none">CATÁLOGO</h1>
                    <p class="text-[10px] font-bold text-emerald-600 uppercase tracking-widest mt-0.5 flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Cotización Blue En Vivo
                    </p>
                </div>
            </div>

            <!-- Resumen flotante header móvil -->
            <div onclick="document.getElementById('lista-carrito')?.scrollIntoView({ behavior: 'smooth', block: 'center' })" class="lg:hidden flex items-center gap-2 bg-slate-900 text-white px-3.5 py-1.5 rounded-full text-xs font-bold shadow-md cursor-pointer active:scale-95 transition-transform">
                <span>🛒</span>
                <span id="cant-items-mobile" class="bg-emerald-500 text-slate-950 px-1.5 py-0.2 rounded-full text-[10px]">0</span>
                <span>$<span id="total-precio-mobile">0</span></span>
            </div>
        </div>
    </header>

    <!-- Banner Mayorista Dinámico (Se oculta o muestra desde el JS) -->
    <div id="banner-promocional" class="bg-slate-900 text-white border-b border-slate-800 py-3 px-4 hidden">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between text-center sm:text-left gap-2">
            <div class="flex items-center gap-2">
                <span class="bg-emerald-500/20 text-emerald-400 text-xs font-bold px-2.5 py-1 rounded-full border border-emerald-500/30">
                    ⚡ PROMO MAYORISTA
                </span>
                <p class="text-xs sm:text-sm font-medium text-slate-300">
                    Llevá <strong class="text-white" id="texto-cantidad-mayorista">5 o más unidades</strong> surtidas y accedé al precio al por mayor.
                </p>
            </div>
        </div>
    </div>

    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-grow">
        
        <div class="flex flex-col lg:flex-row gap-8">
            
            <!-- Productos y Filtros -->
            <section class="w-full lg:w-2/3 xl:w-3/4">
                <div class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200/80 mb-6 space-y-4">
                    <div class="relative">
                        <input type="text" id="input-busqueda" placeholder="Buscar por nombre o producto..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-slate-900/20 focus:bg-white transition-all">
                        <svg class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <div id="contenedor-categorias" class="flex gap-2 overflow-x-auto no-scrollbar pb-1"></div>
                </div>

                <div id="contenedor-productos" class="grid grid-cols-2 sm:grid-cols-2 xl:grid-cols-3 gap-4 sm:gap-6">
                    <div class="col-span-full py-16 text-center text-slate-400 font-medium">
                        Cargando catálogo...
                    </div>
                </div>
            </section>

            <!-- Carrito de Compras -->
            <aside class="w-full lg:w-1/3 xl:w-1/4">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 sm:p-6 sticky top-20">
                    <h2 class="text-base font-black text-slate-900 flex items-center justify-between mb-4 border-b pb-3">
                        <span>🛒 Tu Pedido</span>
                        <span id="badge-total-items" class="text-xs bg-slate-100 text-slate-700 font-bold px-2.5 py-1 rounded-full">0 items</span>
                    </h2>

                    <div id="aviso-mayorista" class="text-xs font-semibold text-slate-600 mb-4 bg-slate-50 p-3 rounded-xl border border-slate-200 text-center">
                        Cargando...
                    </div>

                    <div id="lista-carrito" class="max-h-60 overflow-y-auto no-scrollbar mb-4 space-y-2.5 pr-1">
                        <div class="py-8 text-center text-xs font-medium text-slate-400">
                            El carrito está vacío
                        </div>
                    </div>

                    <div class="flex justify-between items-end py-3 border-t border-slate-100 mb-5">
                        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Total Estimado</span>
                        <div id="total-precio" class="text-right">
                            <div class="text-2xl font-black text-slate-900">$0</div>
                            <div class="total-usd-desktop">USD 0</div>
                        </div>
                    </div>

                    <div class="space-y-2.5 mb-5">
                        <input type="text" id="cliente-nombre" placeholder="Nombre y Apellido *" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-slate-900/20 focus:bg-white transition-all">
                        <input type="text" id="cliente-direccion" placeholder="Dirección / Localidad *" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-slate-900/20 focus:bg-white transition-all">
                        <input type="text" id="cliente-nota" placeholder="Notas adicionales (opcional)" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-slate-900/20 focus:bg-white transition-all">
                    </div>

                    <button onclick="enviarWhatsApp()" class="w-full bg-[#25D366] hover:bg-[#1EBE5A] text-white py-3 rounded-xl font-bold text-xs flex items-center justify-center gap-2 transition-all shadow-md hover:shadow-lg">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.272-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.67-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.076 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421-7.403h-.004a9.87 9.87 0 00-4.858 1.327l-.348-.179-3.611.738.751-2.742-.179-.285A9.879 9.879 0 0112.064 3.051c5.476 0 9.877 4.414 9.877 9.859 0 2.619-.963 5.02-2.567 6.885l-.196-.03c-.308-.062-.6-.169-.847-.326l-1.06-.215-.37.098-1.388 1.713c-.335.413-.84.645-1.374.645-.534 0-1.039-.232-1.374-.645l-1.388-1.713-.37-.098-1.06.215c-.247.157-.539.264-.847.326l-.196.03c-1.604-1.865-2.567-4.266-2.567-6.885 0-5.445 4.401-9.859 9.877-9.859z"/></svg>
                        <span>Enviar Pedido por WhatsApp</span>
                    </button>
                </div>
            </aside>

        </div>
    </main>

    <!-- Modal Popup -->
    <div id="modal-detalle" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 backdrop-blur-sm hidden p-4">
        <div class="bg-white rounded-3xl max-w-md w-full max-h-[95vh] flex flex-col overflow-hidden shadow-2xl relative border border-slate-100 animate-modal">
            
            <button onclick="cerrarModal()" class="absolute top-3 right-3 z-10 bg-white/80 hover:bg-white backdrop-blur-md text-slate-600 w-8 h-8 rounded-full flex items-center justify-center font-bold hover:text-slate-900 transition-all">
                ✕
            </button>

            <div class="overflow-y-auto flex-grow no-scrollbar pb-6">
                <div class="relative bg-slate-100 h-64 w-full shrink-0">
                    <img id="modal-imagen" src="" alt="" class="w-full h-full object-cover transition-opacity duration-300">
                    <span id="modal-categoria" class="absolute bottom-3 left-3 bg-slate-900/80 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full backdrop-blur-md uppercase tracking-widest"></span>
                </div>

                <div id="modal-galeria" class="flex gap-2 p-4 overflow-x-auto no-scrollbar border-b border-slate-100"></div>

                <div class="p-5 sm:p-6 pb-0">
                    <div id="modal-stock-badge" class="mb-2"></div>
                    <h3 id="modal-nombre" class="text-lg font-black text-slate-900 leading-snug mb-1"></h3>
                    <p id="modal-descripcion" class="text-xs text-slate-500 mb-4 leading-relaxed"></p>

                    <!-- Precios dinámicos inyectados por JS -->
                    <div id="contenedor-precios-modal"></div>

                    <div class="space-y-1.5">
                        <label class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block">Cantidad a pedir:</label>
                        <div class="flex items-center gap-3">
                            <div class="flex items-center border border-slate-200 rounded-xl bg-slate-50 p-1">
                                <button type="button" onclick="cambiarCantidadModal(-1)" class="w-9 h-9 flex items-center justify-center font-black text-slate-700 hover:bg-white rounded-lg transition-all">−</button>
                                <input type="number" id="modal-cantidad" value="1" min="1" oninput="validarCantidadInputModal(this)" class="w-12 text-center text-sm font-black text-slate-900 bg-transparent focus:outline-none">
                                <button type="button" onclick="cambiarCantidadModal(1)" class="w-9 h-9 flex items-center justify-center font-black text-slate-700 hover:bg-white rounded-lg transition-all">+</button>
                            </div>
                            <div id="modal-btn-container" class="flex-grow"></div>
                        </div>
                    </div>
                </div>
            </div> 
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200/80 py-6 text-center text-xs text-slate-400">
        <p>© Catálogo Online — Actualizado automáticamente</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
